# Same stack as docker-compose.yml but without host port bindings (for Testcontainers E2E).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ethiomart
      POSTGRES_PASSWORD: ethiomart
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethiomart"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
      POSTGRES_DB: authdb
      POSTGRES_USER: ethiomart
      POSTGRES_PASSWORD: ethiomart
      JWT_SECRET: ethiomart-super-secret-key-change-in-production-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/swagger-ui.html || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  order-service:
